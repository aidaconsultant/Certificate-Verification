<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Verification</title>
  </head>
  <body>
    <!-- Pengambilan Data Eksternal -->
    <script src="https://cdn.jsdelivr.net/gh/aidaconsultant/Certificate-Verification@main/js/certification_database.js?v=1.6"></script>

    <!-- Widget Container -->
    <div id="cert-checker-widget">
      <div class="cert-header">
        <h3>Verifikasi Sertifikat</h3>
        <p>Masukkan ID Sertifikat atau Nama untuk mengecek keaslian.</p>
      </div>

      <div class="cert-search-box">
        <input
          type="text"
          id="cert-input"
          placeholder="Contoh: CERT-2026-001 atau Nama"
          onkeyup="checkEnter(event)"
        />
        <button onclick="searchCertificate()">Cari</button>
      </div>

      <!-- Area Hasil Pencarian -->
      <div
        id="cert-result"
        class="cert-result-container"
        style="display: none"
      ></div>
    </div>

    <style>
      #cert-checker-widget {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        padding: 24px;
        background: #ffffff;
        box-sizing: border-box;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        color: #1a202c;
      }

      .cert-header h3 {
        font-size: clamp(18px, 2vw, 24px);
        margin-top: 0;
      }

      .cert-header p {
        margin: 0 0 16px 0;
        font-size: 0.875rem;
        color: #64748b;
      }

      .cert-search-box {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .cert-search-box input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .cert-search-box input:focus {
        border-color: #0f172a;
      }

      .cert-search-box button {
        padding: 10px 18px;
        background-color: #0f172a;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .cert-search-box button:hover {
        background-color: #334155;
      }

      /* Status Cards */
      .cert-result-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .cert-card {
        padding: clamp(16px, 2vw, 24px);
        border-radius: 8px;
        font-size: clamp(14px, 1.2vw, 16px);
        line-height: 1.6;
      }

      .cert-card.success {
        background-color: #f0fdf4;
        border: 1px solid #bbf7d0;
      }

      .cert-card.error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }

      .cert-badge {
        display: inline-block;
        padding: 2px 8px;
        background-color: #22c55e;
        color: white;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .cert-detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        text-align: right;
        padding: 8px 0;
        width: 100%;
        box-sizing: border-box;
        border-bottom: 1px dashed #e2e8f0;
      }

      .cert-detail-row:last-child {
        border-bottom: none;
      }

      .cert-label {
        color: #64748b;
      }

      .cert-value {
        font-weight: 600;
        color: #0f172a;
      }
    </style>

    <!-- Logika Pencarian Sertifikat (JavaScript) -->
    <script>
      function searchCertificate() {
        const rawInput = document.getElementById("cert-input").value.trim();
        const inputVal = rawInput.toUpperCase();
        const resultContainer = document.getElementById("cert-result");

        if (!rawInput) {
          resultContainer.style.display = "block";
          resultContainer.innerHTML = `
            <div class="cert-card error">
              Mohon masukkan ID Sertifikat atau Nama terlebih dahulu.
            </div>`;
          return;
        }

        // Pastikan variabel database tersedia
        if (typeof certificatesDatabase === "undefined" || !Array.isArray(certificatesDatabase)) {
          resultContainer.style.display = "block";
          resultContainer.innerHTML = `
            <div class="cert-card error">
              Gagal memuat database sertifikat. Pastikan file JavaScript terhubung dengan benar.
            </div>`;
          return;
        }

        // Pencarian:
        // 1. Cocokkan ID persis sama OR
        // 2. Nama mengandung kata yang diinputkan pengguna
        const matches = certificatesDatabase.filter((cert) => {
          const isIdMatch = cert.id && cert.id.toUpperCase() === inputVal;
          const isNameMatch = cert.name && cert.name.toUpperCase().includes(inputVal);
          return isIdMatch || isNameMatch;
        });

        resultContainer.style.display = "block";

        if (matches.length > 0) {
          let htmlResults = "";

          matches.forEach((match) => {
            htmlResults += `
              <div class="cert-card success">
                <span class="cert-badge">✓ SERTIFIKAT VALID</span>
                <div style="margin-top: 8px;">
                  <div class="cert-detail-row">
                    <span class="cert-label">No. Sertifikat:</span>
                    <span class="cert-value">${match.id}</span>
                  </div>
                  <div class="cert-detail-row">
                    <span class="cert-label">Nama Penerima:</span>
                    <span class="cert-value">${match.name}</span>
                  </div>
                  <div class="cert-detail-row">
                    <span class="cert-label">Program/Pelatihan:</span>
                    <span class="cert-value">${match.course}</span>
                  </div>
                  <div class="cert-detail-row">
                    <span class="cert-label">Tanggal Terbit:</span>
                    <span class="cert-value">${match.date}</span>
                  </div>
                </div>
              </div>
            `;
          });

          resultContainer.innerHTML = htmlResults;
        } else {
          resultContainer.innerHTML = `
            <div class="cert-card error">
              ✕ Data <strong>"${rawInput}"</strong> tidak ditemukan. Pastikan memasukkan ID atau Nama dengan benar.
            </div>
          `;
        }
      }

      function checkEnter(event) {
        if (event.key === "Enter") {
          searchCertificate();
        }
      }
    </script>
  </body>
</html>
